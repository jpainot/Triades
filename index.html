<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triades — entraînement</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:35px auto;text-align:center}h1{font-size:1.6rem;margin-bottom:8px}p{color:#536071}.card{background:white;border:1px solid #dce1e8;border-radius:20px;margin:26px 0 20px;padding:65px 15px;box-shadow:0 5px 24px #1720330a}.chord{font-size:clamp(3.2rem,12vw,6rem);font-weight:750;min-height:1.3em}.count{font-size:1rem;color:#667085}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;border-radius:10px;padding:12px 18px;border:1px solid #aeb7c5;background:white;color:#172033;cursor:pointer;min-height:46px}button.primary{background:#172033;color:white;border-color:#172033}button:disabled{opacity:.5;cursor:not-allowed}label{display:flex;align-items:center;gap:8px}small{display:block;color:#667085;margin-top:22px}.progress{height:6px;background:#e7ebf1;border-radius:8px;overflow:hidden;margin-top:25px}.bar{height:100%;background:#3565a5;width:0%;transition:width .1s linear}
</style>
</head>
<body><main>
<h1>Triades majeures, mineures, diminuées et augmentées</h1><p>Trouve et joue l’accord avant l’apparition du suivant.</p>
<section class="card" aria-live="polite"><div class="chord" id="chord">Prêt ?</div><div class="count" id="count">48 accords par série</div><div class="progress"><div class="bar" id="bar"></div></div></section>
<div class="controls"><label for="speed">Temps par accord <select id="speed"><option value="2">2 s</option><option value="4">4 s</option><option value="6" selected>6 s</option><option value="8">8 s</option><option value="10">10 s</option></select></label><button class="primary" id="start">Démarrer</button><button id="pause" disabled>Pause</button><button id="reset">Recommencer</button></div>
<small>Les 12 triades majeures, les 12 mineures, les 12 diminuées et les 12 augmentées apparaissent dans un ordre aléatoire, sans répétition pendant une série.</small>
</main><script>
(()=>{const roots=['Do','Do♯','Ré','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];const all=roots.flatMap(n=>[n+' majeur',n+' mineur',n+' diminué',n+' augmenté']);const chord=document.getElementById('chord'),count=document.getElementById('count'),bar=document.getElementById('bar'),speed=document.getElementById('speed'),start=document.getElementById('start'),pause=document.getElementById('pause'),reset=document.getElementById('reset');let deck=[],idx=-1,remaining=0,last=0,timer=null,running=false;const duration=()=>Number(speed.value)*1000;function shuffle(){deck=[...all];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}function display(){chord.textContent=deck[idx];count.textContent=`Accord ${idx+1} sur 48`;remaining=duration();bar.style.width='0%';}function stop(){running=false;clearInterval(timer);timer=null;pause.disabled=true;start.disabled=false;speed.disabled=false;}function finish(){stop();chord.textContent='Terminé !';count.textContent='48 accords parcourus';bar.style.width='100%';start.textContent='Nouvelle série';}function tick(){const now=performance.now();remaining-=now-last;last=now;if(remaining<=0){idx++;if(idx>=deck.length){finish();return;}display();}bar.style.width=`${Math.min(100,Math.max(0,100-remaining/duration()*100))}%`;}function run(){running=true;last=performance.now();timer=setInterval(tick,50);start.disabled=true;pause.disabled=false;pause.textContent='Pause';speed.disabled=true;}start.addEventListener('click',()=>{if(idx<0||idx>=deck.length-1&&chord.textContent==='Terminé !'){shuffle();idx=0;display();}run();});pause.addEventListener('click',()=>{if(running){stop();pause.disabled=false;pause.textContent='Reprendre';}else{run();}});reset.addEventListener('click',()=>{stop();idx=-1;deck=[];chord.textContent='Prêt ?';count.textContent='48 accords par série';bar.style.width='0%';start.textContent='Démarrer';pause.textContent='Pause';});speed.addEventListener('change',()=>{if(idx>=0&&!running)remaining=duration();});})();
</script></body></html>
